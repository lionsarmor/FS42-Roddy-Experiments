[sudo] password for roddy:
# === Fullscreen ===
fullscreen=yes
fs=yes
ontop=yes
border=no
osc=no               # disable on-screen controller (progress bar)
cursor-autohide=always
input-cursor=no

=== OSD Settings ===
osd-level=1          # ✅ enable text-only OSD (for show-text)
osd-bar=no           # no progress bar
osd-status-msg=      # suppress "unknown/unknown" messages
osd-scale-by-window=yes
osd-ass-cc=yes       # ✅ allow ASS tags (colors/fonts) in OSD text
osd-font="DejaVu Sans Bold"
osd-font-size=42
osd-color="#00FF00"  # default green text
osd-border-size=0
osd-shadow-offset=0
osd-bold=yes


# === OSD (minimal & compatible) ===
# osc=no
# osd-level=1
# osd-status-msg=
# osd-scale-by-window=yes
# osd-ass-cc=yes            # ← enable ASS tags in show-text
# osd-font="DejaVu Sans"
# osd-font-size=42
# osd-border-size=0
# osd-shadow-offset=0


# === Resolution lock (1080p) ===
geometry=1920x1080+0+0
autofit=1920x1080
autofit-larger=1920x1080
autofit-smaller=1920x1080

# === Video output (fast + safe) ===
vo=x11
profile=low-latency
gpu-context=x11
hwdec=no             # no GPU in Xvfb, force CPU decode

# === Window behavior ===
force-window=yes
keep-open=yes
idle=yes             # don’t quit when nothing playing
reset-on-next-file=no

# === Control socket ===
input-ipc-server=/tmp/mpvsocket

# === ALSA Audio Loopback ===
ao=alsa
audio-device=alsa/hw:Loopback,0,0

# === Performance tweaks ===
stop-screensaver=yes
# ⚠️ DO NOT set no-config=yes → otherwise mpv ignores this file

# === Speed hacks ===
# cache=no
# demuxer-thread=no
# hr-seek=no
# untimed=yes
# prefetch-playlist=yes
# gapless-audio=yes
# audio-pitch-correction=no

# === Speed (streams) ===
cache=yes
cache-secs=0.5                # very small cache
demuxer-thread=yes
demuxer-max-bytes=32MiB
demuxer-readahead-secs=0.25
prefetch-playlist=force
hr-seek=no
untimed=yes
vd-lavc-threads=2
ad-lavc-threads=1
cache-pause=no
